name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go:
    name: Go lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service_go
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: service_go/go.mod
          cache-dependency-path: service_go/go.sum

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

  python:
    name: Python lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service_python
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --frozen

      - name: ruff check
        run: uv run ruff check

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build go-gateway image
        run: docker build -t go-gateway:ci service_go

      - name: Build python-ai image
        run: docker build -t python-ai:ci service_python
