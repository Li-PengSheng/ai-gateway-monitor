apiVersion: apps/v1
kind: Deployment
metadata:
    name: go-gateway
spec:
    replicas: 2
    selector:
        matchLabels:
            app: go-gateway
    template:
        metadata:
            labels:
                app: go-gateway
        spec:
            # Must exceed SHUTDOWN_TIMEOUT (75s) so in-flight model requests
            # can drain before the kubelet sends SIGKILL.
            terminationGracePeriodSeconds: 90
            containers:
                - name: go-gateway
                  image: go-gateway:v2
                  ports:
                      - containerPort: 8080
                  env:
                      - name: AI_SERVICE_ADDR
                        # Kubernetes DNS resolves the backend Service inside the cluster.
                        value: "python-ai-svc:50051"
                      - name: JAEGER_ENDPOINT
                        value: "172.17.141.222:4317"
                  resources:
                      requests:
                          cpu: 100m
                          memory: 64Mi
                      limits:
                          cpu: "1"
                          memory: 256Mi
                  livenessProbe:
                      httpGet:
                          path: /healthz
                          port: 8080
                      initialDelaySeconds: 10
                      periodSeconds: 10
                  readinessProbe:
                      httpGet:
                          path: /readyz
                          port: 8080
                      initialDelaySeconds: 5
                      periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
    name: go-gateway-svc
    labels:
        # Must match the ServiceMonitor selector so Prometheus discovers this Service.
        app: go-gateway
spec:
    selector:
        app: go-gateway
    ports:
        # ServiceMonitor references this named port rather than its numeric value.
        - name: web
          protocol: TCP
          port: 80
          targetPort: 8080
    # pprof (:6060) is intentionally not exposed: it binds to localhost inside
    # the pod. Use `kubectl port-forward deployment/go-gateway 6060:6060`
    # (with PPROF_ENABLED=true) for profiling.
