apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: go-gateway-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: go-gateway
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Pods
      pods:
        metric:
          name: p99_latency
        target:
          type: AverageValue
          averageValue: "500m" # 500ms 目标
  behavior:
    scaleUp:
      # Metrics lag behind reality (15s scrape + 3m rate window), so a newly
      # added pod takes minutes to influence p99. Without a stabilization
      # window the HPA keeps doubling on stale data (scale-up oscillation).
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
