apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: go-gateway-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: go-gateway
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Pods
      pods:
        metric:
          name: p99_latency
        target:
          type: AverageValue
          # The adapter reports latency in seconds, so Kubernetes quantity 500m
          # means 0.5 seconds. This target is the demo SLO for gateway-attributable
          # traffic; model routes are excluded because adding gateway pods cannot
          # reduce Ollama inference time.
          averageValue: "500m"
  behavior:
    scaleUp:
      # Metrics lag behind reality: a new pod needs multiple 15s scrapes, while
      # existing series retain samples across the 3m rate window. Without a
      # stabilization window, successive reconciliations can keep scaling on
      # substantially overlapping data.
      stabilizationWindowSeconds: 60
      policies:
        # Add at most two pods per minute so a lagging three-minute quantile
        # cannot drive the deployment straight to maxReplicas in one decision.
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      # Retain excess capacity for five minutes after a spike; removing one pod
      # per minute avoids draining several instances while metrics are still sparse.
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
