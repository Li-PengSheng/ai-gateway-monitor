# Docker Compose Prometheus — dev observability (Grafana dashboards, GPU, port-forward scrape).
# For HPA per-pod metrics, use the in-cluster Prometheus installed via ./deploy.sh hpa-stack.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "go-ai-gateway"
    static_configs:
      - targets: ["host.docker.internal:8080"] # kubectl port-forward via ./deploy.sh forward
  - job_name: "gpu"
    static_configs:
      - targets: ["172.17.141.222:9835"] # patched by deploy.sh gpu
