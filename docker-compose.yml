services:
    # Python AI inference service (gRPC backend)
    python-ai:
        build: ./service_python
        environment:
            - OLLAMA_HOST=http://host.docker.internal:11434
            - JAEGER_ENDPOINT=jaeger:4317
        extra_hosts:
            - "host.docker.internal:host-gateway"
        networks:
            - ai-network
        healthcheck:
            test:
                [
                    "CMD",
                    "python",
                    "-c",
                    "import socket; s=socket.create_connection(('localhost',50051),timeout=5)",
                ]
            interval: 15s
            timeout: 10s
            retries: 3
            start_period: 30s # Allow extra time for model loading at startup
    # Go REST API gateway
    go-gateway:
        build: ./service_go
        ports:
            - "8080:8080" # REST API
            # pprof (:6060) is disabled by default. To enable, set PPROF_ENABLED=true
            # and uncomment the line below:
            # - "6060:6060"
        depends_on:
            python-ai:
                condition: service_healthy
        environment:
            - AI_SERVICE_ADDR=python-ai:50051 # Resolve python-ai by container name
            - JAEGER_ENDPOINT=jaeger:4317
        networks:
            - ai-network
        healthcheck:
            test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
            interval: 10s
            timeout: 5s
            retries: 3
            start_period: 10s
    # Docker Prometheus — dev observability (Grafana, GPU, port-forward scrape).
    # In-cluster Prometheus for HPA: ./deploy.sh hpa-stack
    prometheus:
        image: prom/prometheus:v3.13.0
        extra_hosts:
            - "host.docker.internal:host-gateway"
        volumes:
            - ./prometheus.yml:/etc/prometheus/prometheus.yml
        networks:
            - ai-network
        ports:
            - "9090:9090"

    # Grafana visualization dashboard
    grafana:
        image: grafana/grafana:13.1.0
        ports:
            - "3000:3000"
        networks:
            - ai-network
        depends_on:
            - prometheus
    # Jaeger distributed tracing backend
    jaeger:
        image: jaegertracing/all-in-one:1.76.0
        ports:
            - "16686:16686" # Jaeger UI
            - "4317:4317" # OTLP gRPC receiver
        networks:
            - ai-network

networks:
    ai-network:
        driver: bridge
