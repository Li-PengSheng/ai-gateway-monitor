version: v2
managed:
  enabled: true
  override:
    # Prefixed into generated Go option go_package. Source proto go_package paths
    # may differ; managed mode wins for descriptors. Application imports use the
    # module path in go.mod (my-go-gateway/gen/...), not this prefix string.
    - file_option: go_package_prefix
      value: ai-microservice-demo/service_go/gen/proto
plugins:
  # Go protobuf + gRPC stubs → service_go/gen (paths=source_relative)
  - remote: buf.build/protocolbuffers/go
    out: service_go/gen
    opt:
      - paths=source_relative
  - remote: buf.build/grpc/go
    out: service_go/gen
    opt:
      - paths=source_relative
  # Python stubs (versions pinned to pyproject protobuf/grpcio)
  - remote: buf.build/protocolbuffers/python:v33.5  # protobuf==6.33.5
    out: service_python/gen
  - remote: buf.build/grpc/python:v1.78.0           # grpcio==1.78.0
    out: service_python/gen
  - remote: buf.build/protocolbuffers/pyi:v33.5     # protobuf==6.33.5
    out: service_python/gen
